name: CI

on:
  push:
    branches:
      - feat/*
      - enh/*
      - bug/*
      - chore/*
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/ci.yaml"
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - closed
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}



jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    outputs:
      BUMP_LEVEL: ${{ steps.get_bump_level.outputs.bump-level }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout application GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run labeler
        id: labeler
        uses: github/issue-labeler@v3.4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ".github/labeler.yml"
          include-title: 1
          include-body: 1
          enable-versioned-regex: 0
          sync-labels: 1
        continue-on-error: true

      - name: Check and return bump label from PR
        id: get_bump_level
        run: |
          LABELS_ADDED=${{ steps.labeler.outputs.labels-added }}
          echo "LABELS_ADDED=${{ steps.labeler.outputs.labels-added }}"
          if [[ $LABELS_ADDED == *"major"* ]]; then
            echo "Bump level is major"
            echo "bump-level=major" >> $GITHUB_OUTPUT
          elif [[ $LABELS_ADDED == *"minor"* ]]; then
            echo "Bump level is minor"
            echo "bump-level=minor" >> $GITHUB_OUTPUT
          elif [[ $LABELS_ADDED == *"patch"* ]]; then
            echo "Bump level is patch"
            echo "bump-level=patch" >> $GITHUB_OUTPUT
          else
            echo "No bump level found. Exiting...."
            exit 1
          fi

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    if: "!failure()"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/

      - name: Pytest
        run: pytest

  generate-version:
    runs-on: ubuntu-latest
    needs: [pr-labeler]
    if: "!failure()"
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      VERSION_PREFIX: ""
      BUMP_LEVEL: ${{ needs.pr-labeler.outputs.BUMP_LEVEL }}
    outputs:
      CURRENT_VERSION: ${{ steps.get_current_release.outputs.current_version }}
      NEXT_VERSION: ${{ steps.get_next_release.outputs.next_version }}
      INITIAL_RELEASE: ${{ steps.get_current_release.outputs.initial_release }}
    steps:
      - name: Checkout application GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Current Release
        id: get_current_release
        uses: actions/github-script@v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const prefix = `${{ env.VERSION_PREFIX }}`;
            let branch;
            if (context.eventName === 'pull_request') {
              if (['opened', 'edited', 'synchronize'].includes(context.payload.action)) {
                branch = process.env.GITHUB_HEAD_REF;
              } else if (context.payload.action === 'closed') {
                branch = process.env.GITHUB_BASE_REF;
              }
            } else {
              branch = process.env.GITHUB_REF_NAME || 'main';
            }
            if (branch === 'main') {
              let version = '0.0.0';
              let releases = [];
              let page = 1;
              while (true) {
                const response = await github.rest.repos.listReleases({
                  owner: owner, repo: repo, per_page: 100, page: page
                });
                if (response.data.length === 0) break;
                releases = releases.concat(response.data);
                page++;
              }
              let currentRelease = null;
              const prefixRegex = new RegExp(`^${prefix}\\d+\\.\\d+\\.\\d+$`);
              for (const release of releases) {
                if (prefixRegex.test(release.tag_name)) {
                  if (!currentRelease || new Date(release.created_at) > new Date(currentRelease.created_at)) {
                    currentRelease = release;
                    version = currentRelease.tag_name.replace(`${prefix}`, '');
                  }
                }
              }
              if (!currentRelease) {
                core.setOutput('initial_release', 'true');
                currentRelease = { tag_name: `${prefix}${version}` };
              } else {
                core.setOutput('initial_release', 'false');
                core.setOutput('current_tag', `${version}`);
              }
              core.setOutput('current_version', currentRelease.tag_name);
            } else {
              const shortSha = process.env.GITHUB_SHA.substring(0, 7);
              const runNumber = process.env.GITHUB_RUN_NUMBER;
              const ticket = branch.match(/\w+-\d+/);
              const version = ticket ? `${ticket}-${shortSha}-${runNumber}` : `${shortSha}-${runNumber}`;
              core.setOutput('current_version', version);
            }

      - name: Get Next Release
        id: get_next_release
        uses: actions/github-script@v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const prefix = `${{ env.VERSION_PREFIX }}`;
            const bumpLabel = `${{ env.BUMP_LEVEL }}`;
            const currentRelease = `${{ steps.get_current_release.outputs.current_version }}`;
            const initialRelease = `${{ steps.get_current_release.outputs.initial_release }}`;
            let branch;
            if (context.eventName === 'pull_request') {
              if (['opened', 'edited', 'synchronize'].includes(context.payload.action)) {
                branch = process.env.GITHUB_HEAD_REF;
              } else if (context.payload.action === 'closed') {
                branch = process.env.GITHUB_BASE_REF;
              }
            } else {
              branch = process.env.GITHUB_REF_NAME || 'main';
            }
            if (branch === 'main') {
              let versionToBump = `${bumpLabel}`;
              const versionRegex = /^(\d+)\.(\d+)\.(\d+)$/;
              const match = currentRelease.replace(prefix, "").match(versionRegex);
              if (!match) {
                console.error(`Error: currentRelease is not a valid version string: ${currentRelease}`);
                process.exit(1);
              }
              const [, major, minor, patch] = match;
              let newVersion = [parseInt(major), parseInt(minor), parseInt(patch)];
              switch (versionToBump) {
                case "major":
                  newVersion[0]++;
                  newVersion[1] = 0;
                  newVersion[2] = 0;
                  break;
                case "minor":
                  newVersion[1]++;
                  newVersion[2] = 0;
                  break;
                case "patch":
                  newVersion[2]++;
                  break;
                default:
                  console.error(`Error: versionToBump is not valid: '${versionToBump}'`);
                  process.exit(1);
              }
              const nextRelease = `${prefix}${newVersion.join(".")}`;
              core.setOutput('next_version', nextRelease);
              core.setOutput('next_tag', `${newVersion.join(".")}`);
            } else {
              core.setOutput('next_version', currentRelease);
              core.setOutput('next_tag', currentRelease.replace(prefix, ""));
            }



  tag-and-release:
    needs: [generate-version, lint-and-test]
    runs-on: ubuntu-latest
    if: "!failure() && github.base_ref == 'main' && github.event.pull_request.merged == true"
    permissions:
      contents: write
    steps:
      - name: Checkout application GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: create_release_notes
        uses: actions/github-script@v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const current_release = `${{ needs.generate-version.outputs.CURRENT_VERSION }}`;
            const initial_release = `${{ needs.generate-version.outputs.INITIAL_RELEASE }}`;
            const next_release = `${{ needs.generate-version.outputs.NEXT_VERSION }}`;
            let release;
            if (initial_release == 'true') {
              release = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: next_release,
              });
            } else {
              release = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: next_release, previous_tag_name: current_release,
              });
            }
            core.setOutput('release_notes', release.data.body);

      - name: Create Release with Release Notes
        id: create_release
        uses: actions/github-script@v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const next_release = `${{ needs.generate-version.outputs.NEXT_VERSION }}`;
            const release_notes = `${{ steps.create_release_notes.outputs.release_notes }}`;
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              name: next_release, tag_name: next_release,
              body: release_notes, make_latest: 'true'
            });
            core.setOutput('release_html_url', release.html_url);

      - name: Print Outputs
        run: |
          echo "Created GitHub Release: ${{ steps.create_release.outputs.release_html_url }}"


